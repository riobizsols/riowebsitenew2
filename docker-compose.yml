# RioBizSols.com — VPS (behind existing alm_nginx on :80/:443)
#
# Your VPS already uses alm_nginx for ports 80/443. This stack only runs the
# Express+React app on localhost:3010. Point riobizsols.com in alm_nginx to it.
#
# Usage:
#   1. cp .env.vps.example .env.vps
#   2. ./deploy/scripts/deploy.sh
#   3. Add deploy/nginx/alm-nginx-riobizsols.conf into alm_nginx and reload
#
# Optional standalone (only if NOTHING else uses 80/443):
#   docker compose --profile standalone --env-file .env.vps up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riobizsols-app
    restart: unless-stopped
    env_file:
      - path: .env.vps
        required: false
    environment:
      NODE_ENV: production
      PORT: "3003"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://riobizsols.com,https://www.riobizsols.com}
      CHATBOT_PUBLIC_BASE_URL: ${CHATBOT_PUBLIC_BASE_URL:-https://riobizsols.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://riobizsols.com}
    volumes:
      - app_data:/app/data
    # Host 3003 is already used by alm-pressana-frontend — use 3010.
    ports:
      - "127.0.0.1:3010:3003"
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Only with: --profile standalone  (conflicts with alm_nginx — do not use on this VPS)
  nginx:
    profiles: ["standalone"]
    image: nginx:1.27-alpine
    container_name: riobizsols-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

  certbot:
    profiles: ["standalone"]
    image: certbot/certbot:latest
    container_name: riobizsols-certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - web

volumes:
  app_data:

networks:
  web:
    driver: bridge
