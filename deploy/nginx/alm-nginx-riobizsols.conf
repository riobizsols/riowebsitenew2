# Add this file to your EXISTING alm_nginx config (ports 80/443 owner),
# then reload alm_nginx. Do NOT start riobizsols-nginx on this VPS.
#
# Find alm_nginx config on the VPS, e.g.:
#   docker inspect alm_nginx --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
#
# Typical locations:
#   /path/to/alm/nginx/conf.d/riobizsols.conf
#   or a volume mounted into alm_nginx at /etc/nginx/conf.d/
#
# Proxy target: riobizsols-app published on the host at 127.0.0.1:3010
# From inside alm_nginx container, host is usually:
#   http://172.17.0.1:3010
# or (Docker Desktop / newer engines):
#   http://host.docker.internal:3010

upstream riobizsols_website {
  # Prefer host gateway (works when app publishes 127.0.0.1:3010:3003)
  server 172.17.0.1:3010;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name riobizsols.com www.riobizsols.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name riobizsols.com www.riobizsols.com;

  # Reuse the same cert style as your other alm_nginx sites.
  # Adjust paths to match how alm_nginx stores certificates.
  ssl_certificate     /etc/letsencrypt/live/riobizsols.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/riobizsols.com/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://riobizsols_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
