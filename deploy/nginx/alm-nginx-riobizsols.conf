# Mounted into alm_nginx as /etc/nginx/conf.d/riobizsols.com.conf
# SSL files are bind-mounted into /etc/nginx/ssl/ (same pattern as other sites).

upstream riobizsols_website {
  server 172.17.0.1:3010;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name riobizsols.com www.riobizsols.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name riobizsols.com www.riobizsols.com;

  # Paths INSIDE the container (after docker -v mounts)
  ssl_certificate     /etc/nginx/ssl/fullchain-riobizsols.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey-riobizsols.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://riobizsols_website;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
