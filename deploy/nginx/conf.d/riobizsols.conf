# riobizsols.com
# First boot: HTTP proxies to the app (so site works before SSL).
# After ./deploy/scripts/init-ssl.sh, HTTPS is enabled with Let's Encrypt.

# ── HTTP ────────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name riobizsols.com www.riobizsols.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Until real certs exist, serve over HTTP so deploy is not blocked.
  # After SSL init, this redirects to HTTPS (see map below via include of ssl snippet).
  location / {
    # If SSL certs are present, redirect; otherwise proxy (handled by bootstrap map).
    set $redirect_https 0;
    if (-f /etc/letsencrypt/live/riobizsols.com/fullchain.pem) {
      set $redirect_https 1;
    }
    if ($redirect_https = 1) {
      return 301 https://$host$request_uri;
    }

    proxy_pass http://riobizsols_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}

# ── HTTPS (only used when cert files exist; nginx still needs files on disk) ─
# Self-signed placeholders are created by deploy/scripts/ensure-certs.sh
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name riobizsols.com www.riobizsols.com;

  ssl_certificate     /etc/letsencrypt/live/riobizsols.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/riobizsols.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://riobizsols_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
