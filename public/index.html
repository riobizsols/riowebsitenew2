    <!-- Google Tag Manager (single container; GA4 + Ads configured inside GTM) -->
    <script>
      (function () {
        function loadGtm() {
          (function (w, d, s, l, i) {

        var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
        var isThankYouPage = path.indexOf('/thank-you') !== -1;
        // Thank-you / conversion pages: load GTM immediately so lead tags fire.
        if (isThankYouPage) {
          loadGtm();
        } else {
          // PageSpeed: defer GTM until first user interaction on other pages.
          var gtmStarted = false;
          function startGtmOnce() {
            if (gtmStarted) return;
            gtmStarted = true;
            loadGtm();
            ['scroll', 'click', 'touchstart', 'keydown'].forEach(function (ev) {
              window.removeEventListener(ev, startGtmOnce, true);
            });
          }
          ['scroll', 'click', 'touchstart', 'keydown'].forEach(function (ev) {
            window.addEventListener(ev, startGtmOnce, { capture: true, passive: true });
          });
        }
      })();
    </script>
